name: Build APK

on:
  push:
    paths:
      - 'planer-bundle.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project from planer-bundle.txt
        run: |
          python3 - <<'PY'
          import os, re
          src = open('planer-bundle.txt', encoding='utf-8').read()
          parts = re.split(r'^### FILE: (.+)$', src, flags=re.M)
          for i in range(1, len(parts), 2):
              path = parts[i].strip()
              body = parts[i + 1].lstrip('\n')
              os.makedirs(os.path.dirname(path) or '.', exist_ok=True)
              with open(path, 'w', encoding='utf-8') as f:
                  f.write(body)
              print('unpacked', path)
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk planer-dnya.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Планер дня, сборка ${{ github.run_number }}
          files: planer-dnya.apk
